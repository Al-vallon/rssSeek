name: rss
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - id: bot
        run: python rss_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true
      - name: Sauvegarde de l'état
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          [ -f seen.json ] && git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "update seen"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 3
          done
          exit 1
      - name: Échec du bot
        if: steps.bot.outcome == 'failure'
        run: exit 1
